name = "chrome-hearts-monitor"
main = "src/worker.js"
compatibility_date = "2026-06-23"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
WORKERS_PLAN = "free"
STAGING_LANE_ENABLED = "true"
HOT_WATCH_LIMIT = "12"
PING_FIRST_ALERTS = "true"
FRESH_MISSING_GRACE_MINUTES = "30"
FAST_POLL_ENABLED = "true"
FAST_POLL_INTERVAL_SECONDS = "12"
FULL_SWEEP_EVERY_TICKS = "4"
FAST_CATEGORY_SHARD_SIZE = "40"
FAST_MAX_CATEGORIES = "36"
SUBREQUEST_HARD_CAP = "46"
DISCOVERY_EVERY_FULL_SWEEPS = "10"
SEARCH_QUERIES = "chrome,hearts"
CHECK_MIN_INTERVAL_SECONDS = "0"
CATEGORY_FETCH_CONCURRENCY = "20"
FANOUT_SLICE_SIZE = "40"
SETTINGS_KEY = "chrome-hearts:cloudflare:settings"
EXACT_STOCK_PROBE_CONCURRENCY = "3"
EXACT_STOCK_PROBE_QUANTITY = "999"
MAX_ALERTS_PER_RUN = "5"
MAX_CATEGORY_IDS = "250"
MAX_CATEGORY_PAGES = "2"
MAX_DIRECT_PRODUCT_URLS = "4"
MAX_STOREFRONT_SUBREQUESTS = "40"
SCAN_ALL_CATEGORIES_ON_FULL_SWEEP = "true"
MAX_PAGES = "10"
MIN_PRODUCTS = "1"
PAGE_SIZE = "200"
RELIST_AFTER_ABSENT_RUNS = "2"
PROBE_EXACT_STOCK = "true"
DISCOVER_SITEMAP_CATEGORIES = "true"
DISCOVER_HOMEPAGE_CATEGORIES = "true"
DISCOVER_PRODUCT_URL_CATEGORIES = "true"
DISCOVER_ROBOTS_PRODUCTS = "true"
PROSPECTIVE_CATEGORY_SHARD_SIZE = "60"
LOG_BUFFER_SIZE = "600"
LOG_VERBOSE = "true"
DASHBOARD_USERNAME = "chrome-hearts"

[triggers]
crons = ["* * * * *"]

[[services]]
binding = "SELF"
service = "chrome-hearts-monitor"

[[kv_namespaces]]
binding = "STATE"
id = "<your-kv-namespace-id>"
preview_id = "<your-preview-kv-namespace-id>"

[[durable_objects.bindings]]
name = "MONITOR"
class_name = "MonitorController"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorController"]
