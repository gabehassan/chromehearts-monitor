name: Chrome Hearts Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: chrome-hearts-monitor
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Vercel monitor
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ] || [ -z "${MONITOR_URL:-}" ]; then
            echo "CRON_SECRET and MONITOR_URL secrets are required"
            exit 1
          fi

          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error --location \
              --max-time 45 \
              --retry 2 \
              --retry-delay 5 \
              --retry-all-errors \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "$MONITOR_URL"
          )"

          echo "HTTP ${status}"
          cat "$response_file"
          echo

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require("fs");
          const path = process.argv[2];
          const body = JSON.parse(fs.readFileSync(path, "utf8"));
          if (!body.ok) {
            console.error(body);
            process.exit(1);
          }
          NODE
